<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source of public/og-image.png (the link-preview card). Re-render with scripts/seo/build-og-image.sh -->
  <defs>
    <radialGradient id="bg" cx="0.78" cy="0.5" r="0.9">
      <stop offset="0" stop-color="#16324f" />
      <stop offset="1" stop-color="#0f172a" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g fill="none" stroke="#0ea5e9" stroke-opacity="0.35" stroke-width="3">
    <circle cx="900" cy="315" r="270" />
    <circle cx="900" cy="315" r="180" />
    <circle cx="900" cy="315" r="90" />
    <path d="M900 45V585M630 315H1170" stroke-opacity="0.18" />
  </g>
  <!-- Runway, lined up with the end of the flight path (heading up-right, -39deg) -->
  <g transform="translate(1092 122) rotate(-39)">
    <rect x="-95" y="-15" width="190" height="30" rx="4" fill="#334155" stroke="#64748b" stroke-width="2" />
    <path d="M-70 0H70" stroke="#f1f5f9" stroke-width="3" stroke-dasharray="14 12" />
    <rect x="-95" y="-15" width="14" height="30" rx="3" fill="#ef4444" />
  </g>
  <!-- Flight path: ends at the runway's threshold; the plane sits on it, nose along the path -->
  <path d="M740 520C820 470 870 440 900 380S1010 210 1038 158" fill="none" stroke="#facc15" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round" />
  <path transform="translate(900 380) rotate(27) scale(3.4) translate(-32 -32)" fill="#38bdf8"
    d="M32 10c2 0 3 2 3 5v9l15 9v4l-15-4v9l5 4v3l-8-2-8 2v-3l5-4v-9l-15 4v-4l15-9v-9c0-3 1-5 3-5z" />
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#f1f5f9">
    <text x="80" y="270" font-size="88" font-weight="800">Radar Command</text>
    <text x="80" y="340" font-size="40" font-weight="500" fill="#7dd3fc">Free 3D air traffic control game</text>
    <text x="80" y="420" font-size="30" fill="#cbd5e1">Draw flight paths. Land every plane.</text>
    <text x="80" y="465" font-size="30" fill="#cbd5e1">Never let two of them touch.</text>
    <text x="80" y="560" font-size="26" fill="#94a3b8">Play in your browser · no download · desktop &amp; mobile</text>
  </g>
</svg>
